# Cloudflare Worker for the THINKBIG AI website assistant. See README.md for setup.
name = "thinkbig-chat-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Sites allowed to call the API (comma-separated, exact origins, no trailing slash)
ALLOWED_ORIGINS = "https://jovingj24jan-png.github.io,http://localhost:5173,http://127.0.0.1:5173"

# 12 chat requests per minute per visitor IP
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[observability]
enabled = true

# Secrets are never stored here. Set the API key with:
#   npx wrangler secret put ANTHROPIC_API_KEY
